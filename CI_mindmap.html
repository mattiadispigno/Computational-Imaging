<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script><script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.js"></script><script src="https://cdn.jsdelivr.net/npm/markmap-toolbar@0.18.12/dist/index.js"></script><script>(()=>{setTimeout(()=>{const{markmap:S,mm:Q}=window,$=new S.Toolbar;$.attach(Q);const I=$.render();I.setAttribute("style","position:absolute;bottom:20px;right:20px"),document.body.append(I)})})()</script><script>((l,U,M,R)=>{const N=l();window.mm=N.Markmap.create("svg#mindmap",(U||N.deriveOptions)(R),M),window.matchMedia("(prefers-color-scheme: dark)").matches&&document.documentElement.classList.add("markmap-dark")})(()=>window.markmap,null,{"content":"Computational Imaging e Computer Vision","children":[{"content":"1. Acquisizione e Rappresentazione (Dal Fisico al Digitale)","children":[{"content":"Digitalizzazione (Campionamento e Quantizzazione)","children":[{"content":"<strong>Definizione:</strong> Passaggio dalla luce continua (radianza) a una griglia discreta di pixel. Il campionamento definisce la risoluzione spaziale, la quantizzazione definisce i livelli di intensit&#xe0; (profondit&#xe0; di colore).","children":[],"payload":{"tag":"li","lines":"9,10"}},{"content":"<strong>Motivazione/Scopo:</strong> Permette al calcolatore di gestire e memorizzare l&apos;informazione visiva infinita in matrici finite di numeri.","children":[],"payload":{"tag":"li","lines":"10,11"}},{"content":"<strong>Collegamento:</strong> &#xc8; la base per qualsiasi operazione algoritmica; introduce per&#xf2; una prima perdita di informazione e l&apos;errore di quantizzazione.","children":[],"payload":{"tag":"li","lines":"11,13"}}],"payload":{"tag":"h3","lines":"8,9"}},{"content":"Formati Immagine e Standard DICOM","children":[{"content":"<strong>Definizione:</strong> Metodi per salvare matrici sul disco. Includono formati lossy (JPEG), lossless (PNG, TIFF) e contenitori medici (DICOM).","children":[],"payload":{"tag":"li","lines":"14,15"}},{"content":"<strong>Motivazione/Scopo:</strong> Il DICOM &#xe8; vitale per l&apos;imaging medico in quanto accorpa l&apos;immagine (dataset) e i metadati clinici/geometrici (es. pixel spacing per misure millimetriche). I formati lossless sono obbligatori per non alterare l&apos;analisi scientifica.","children":[],"payload":{"tag":"li","lines":"15,16"}},{"content":"<strong>Collegamento:</strong> Determina l&apos;integrit&#xe0; dei dati prima che vengano caricati in memoria (tramite librerie come OpenCV o Pydicom) per il preprocessing.","children":[],"payload":{"tag":"li","lines":"16,18"}}],"payload":{"tag":"h3","lines":"13,14"}}],"payload":{"tag":"h2","lines":"7,8"}},{"content":"2. Preprocessing e Pixel Tools (Preparazione dei Dati)","children":[{"content":"Normalizzazione in Floating-Point e Clip","children":[{"content":"<strong>Definizione:</strong> Conversione dei pixel da interi 8-bit (0-255) a numeri con virgola mobile (0.0 - 1.0) e limitazione forzata nei range visibili tramite <code>np.clip</code>.","children":[],"payload":{"tag":"li","lines":"20,21"}},{"content":"<strong>Motivazione/Scopo:</strong> Previene artefatti visivi disastrosi causati dall&apos;overflow matematico (es. 250+10 = 4 nei formati uint8) e garantisce calcoli precisi durante divisioni/moltiplicazioni.","children":[],"payload":{"tag":"li","lines":"21,22"}},{"content":"<strong>Collegamento:</strong> &#xc8; il passaggio zero obbligatorio prima di applicare qualsiasi filtro matematico o iniezione di rumore.","children":[],"payload":{"tag":"li","lines":"22,24"}}],"payload":{"tag":"h3","lines":"19,20"}},{"content":"Istogramma ed Equalizzazione","children":[{"content":"<strong>Definizione:</strong> L&apos;istogramma &#xe8; la distribuzione statistica delle intensit&#xe0; dei pixel (PDF). L&apos;equalizzazione mappa queste intensit&#xe0; usando la funzione cumulativa (CDF) per rendere la distribuzione piatta.","children":[],"payload":{"tag":"li","lines":"25,26"}},{"content":"<strong>Motivazione/Scopo:</strong> L&apos;equalizzazione serve a massimizzare il contrasto globale e a rendere visibili dettagli nascosti in immagini sotto/sovraesposte &quot;spalmando&quot; le intensit&#xe0; su tutto il range 0-255.","children":[],"payload":{"tag":"li","lines":"26,27"}},{"content":"<strong>Collegamento:</strong> Migliora l&apos;immagine per la visione umana o prepara i dati per algoritmi di segmentazione semantica tramite sogliatura (thresholding).","children":[],"payload":{"tag":"li","lines":"27,29"}}],"payload":{"tag":"h3","lines":"24,25"}},{"content":"Rumore delle Immagini (Image Noise)","children":[{"content":"<strong>Definizione:</strong> Variazione casuale indesiderata nei pixel, classificata in non-correlato (Gaussiano, Sale e Pepe) e correlato/dipendente dal segnale (Poisson, Speckle).","children":[],"payload":{"tag":"li","lines":"30,31"}},{"content":"<strong>Motivazione/Scopo:</strong> Il rumore nasconde i dettagli e degrada le prestazioni algoritmiche; modellare statisticamente la sua origine fisica &#xe8; cruciale per poterlo rimuovere.","children":[],"payload":{"tag":"li","lines":"31,32"}},{"content":"<strong>Collegamento:</strong> Il modello del rumore definisce quale termine di <em>Data Fitting</em> (es. norma L2 per Gaussiano) utilizzare in fase di risoluzione del problema inverso.","children":[],"payload":{"tag":"li","lines":"32,34"}}],"payload":{"tag":"h3","lines":"29,30"}}],"payload":{"tag":"h2","lines":"18,19"}},{"content":"3. Elaborazione Spaziale (Filtraggio)","children":[{"content":"Sistemi LSIS e Convoluzione 2D","children":[{"content":"<strong>Definizione:</strong> Sistemi Lineari Invarianti alla Traslazione. La convoluzione &#xe8; l&apos;operatore matematico (integrale/sommatoria) che fa &quot;scorrere&quot; un kernel (filtro) sull&apos;immagine, calcolando la media pesata locale.","children":[],"payload":{"tag":"li","lines":"36,37"}},{"content":"<strong>Motivazione/Scopo:</strong> &#xc8; il motore matematico che descrive l&apos;interazione tra luce e lente, nonch&#xe9; la base per applicare filtri di manipolazione o reti neurali CNN.","children":[],"payload":{"tag":"li","lines":"37,38"}},{"content":"<strong>Collegamento:</strong> Le propriet&#xe0; della convoluzione rendono possibile l&apos;utilizzo della Trasformata di Fourier per abbattere i tempi di calcolo.","children":[],"payload":{"tag":"li","lines":"38,40"}}],"payload":{"tag":"h3","lines":"35,36"}},{"content":"Filtri Lineari (Gaussiano)","children":[{"content":"<strong>Definizione:</strong> Kernel a forma di campana che attenua le alte frequenze. Gode della propriet&#xe0; di separabilit&#xe0; computazionale.","children":[],"payload":{"tag":"li","lines":"41,42"}},{"content":"<strong>Motivazione/Scopo:</strong> Esegue lo smoothing (sfocatura) riducendo il rumore Gaussiano in modo naturale senza creare &quot;effetti a blocchi&quot; tipici del filtro Box.","children":[],"payload":{"tag":"li","lines":"42,43"}},{"content":"<strong>Collegamento:</strong> Purtroppo, sfoca irrimediabilmente anche i bordi netti degli oggetti, richiedendo l&apos;uso di approcci non lineari o regolarizzatori complessi.","children":[],"payload":{"tag":"li","lines":"43,45"}}],"payload":{"tag":"h3","lines":"40,41"}},{"content":"Filtri Non Lineari (Mediano e Bilaterale)","children":[{"content":"<strong>Definizione:</strong> Il Mediano sostituisce il pixel con la statistica mediana del vicinato. Il Bilaterale pesa i vicini sia per distanza spaziale che per differenza di luminosit&#xe0;.","children":[],"payload":{"tag":"li","lines":"46,47"}},{"content":"<strong>Motivazione/Scopo:</strong> Il Mediano &#xe8; l&apos;unico strumento efficace per rimuovere il rumore impulsivo &quot;Sale e Pepe&quot;. Il Bilaterale permette di sfocare le aree omogenee preservando i bordi taglienti (edge-preserving).","children":[],"payload":{"tag":"li","lines":"47,48"}},{"content":"<strong>Collegamento:</strong> Risolvono i limiti dei filtri lineari standard, ma non possono essere applicati tramite il Teorema della Convoluzione (esigono calcoli spaziali pesanti).","children":[],"payload":{"tag":"li","lines":"48,50"}}],"payload":{"tag":"h3","lines":"45,46"}}],"payload":{"tag":"h2","lines":"34,35"}},{"content":"4. Dominio delle Frequenze (Analisi Spettrale)","children":[{"content":"Trasformata di Fourier Discreta (DFT / FFT)","children":[{"content":"<strong>Definizione:</strong> Operatore che mappa l&apos;immagine dal dominio spaziale a quello delle frequenze spaziali, descrivendola con numeri complessi (Magnitudo e Fase).","children":[],"payload":{"tag":"li","lines":"52,53"}},{"content":"<strong>Motivazione/Scopo:</strong> La Magnitudo contiene l&apos;energia (contrasto), ma la Fase contiene la struttura semantica e i bordi (vitali per CV). L&apos;algoritmo FFT riduce la complessit&#xe0; computazionale da O(N^2) a O(N logN).","children":[],"payload":{"tag":"li","lines":"53,54"}},{"content":"<strong>Collegamento:</strong> Permette di manipolare globalmente l&apos;immagine filtrando frequenze specifiche e applicando la compressione lossy (es. JPEG/DCT).","children":[],"payload":{"tag":"li","lines":"54,56"}}],"payload":{"tag":"h3","lines":"51,52"}},{"content":"Il Teorema della Convoluzione","children":[{"content":"<strong>Definizione:</strong> Dimostra che una convoluzione nello spazio equivale a una banale moltiplicazione nel dominio delle frequenze.","children":[],"payload":{"tag":"li","lines":"57,58"}},{"content":"<strong>Motivazione/Scopo:</strong> Rende computazionalmente possibile l&apos;applicazione di filtri spaziali enormi in tempi infinitesimi.","children":[],"payload":{"tag":"li","lines":"58,59"}},{"content":"<strong>Collegamento:</strong> &#xc8; il trucco computazionale fondante per algoritmi iterativi veloci in ricostruzione e deblurring (applicando FFT2 e IFFT2 ad ogni passo).","children":[],"payload":{"tag":"li","lines":"59,61"}}],"payload":{"tag":"h3","lines":"56,57"}}],"payload":{"tag":"h2","lines":"50,51"}},{"content":"5. Il Cuore Matematico: Problemi Inversi","children":[{"content":"Problema Diretto vs Problema Inverso","children":[{"content":"<strong>Definizione:</strong> Il Problema Diretto modella fisicamente l&apos;acquisizione (Causa -&gt; Effetto). Il Problema Inverso cerca di stimare l&apos;oggetto reale partendo dai dati misurati (Effetto -&gt; Causa), spesso formulato come  Ax = y + e .","children":[],"payload":{"tag":"li","lines":"63,64"}},{"content":"<strong>Motivazione/Scopo:</strong> La fisica causa sempre una &quot;perdita di informazione&quot; (limiti ottici, discretizzazione), rendendo impossibile un recupero esatto e analitico della scena.","children":[],"payload":{"tag":"li","lines":"64,65"}},{"content":"<strong>Collegamento:</strong> Introduce la necessit&#xe0; di passare da semplici inversioni di matrice a framework di ottimizzazione complessi.","children":[],"payload":{"tag":"li","lines":"65,67"}}],"payload":{"tag":"h3","lines":"62,63"}},{"content":"Mal Condizionamento e Decomposizione SVD (Fallimento Naive)","children":[{"content":"<strong>Definizione:</strong> I problemi inversi in imaging violano le condizioni di Hadamard (non unicit&#xe0;, instabilit&#xe0;). La matrice del sistema ha un numero di condizionamento estremo.","children":[],"payload":{"tag":"li","lines":"68,69"}},{"content":"<strong>Motivazione/Scopo:</strong> Spiega matematicamente perch&#xe9; dividendo i dati per l&apos;operatore diretto (soluzione naive / Filtro Inverso) il risultato fallisce. I piccoli valori singolari nella SVD amplificano il rumore ad alta frequenza verso l&apos;infinito.","children":[],"payload":{"tag":"li","lines":"69,70"}},{"content":"<strong>Collegamento:</strong> L&apos;esplosione del rumore rende assolutamente obbligatorio l&apos;uso della Regolarizzazione e dell&apos;informazione &quot;A Priori&quot;.","children":[],"payload":{"tag":"li","lines":"70,72"}}],"payload":{"tag":"h3","lines":"67,68"}}],"payload":{"tag":"h2","lines":"61,62"}},{"content":"6. La Soluzione: Regolarizzazione Model-Based e Ottimizzazione","children":[{"content":"Il Framework Bayesiano e il Termine di Data Fitting","children":[{"content":"<strong>Definizione:</strong> Il restauro si riformula minimizzando un&apos;equazione composta da due parti: la Fedelt&#xe0; ai dati (Likelihood / Modello Fisico e Statistico) e il Regolarizzatore (Prior / Conoscenza Pregressa).","children":[],"payload":{"tag":"li","lines":"74,75"}},{"content":"<strong>Motivazione/Scopo:</strong> Si smette di cercare la soluzione &quot;esatta&quot; (rovinata dal rumore) per calcolare l&apos;immagine pi&#xf9; statisticamente probabile (Metodo MAP - Maximum A Posteriori).","children":[],"payload":{"tag":"li","lines":"75,76"}},{"content":"<strong>Collegamento:</strong> Il bilanciamento tra questi due termini &#xe8; governato dal parametro vitale  \\&#x3bb; .","children":[],"payload":{"tag":"li","lines":"76,78"}}],"payload":{"tag":"h3","lines":"73,74"}},{"content":"Tikhonov (L2) vs Regolarizzazione Sparsa (L1, Total Variation)","children":[{"content":"<strong>Definizione:</strong> Tikhonov usa la norma L2, penalizzando grandi salti e rendendo tutto &quot;smooth&quot;. La norma L1 spinge a zero i coefficienti (sparsit&#xe0;). La Total Variation (TV) applica L1 al gradiente dell&apos;immagine.","children":[],"payload":{"tag":"li","lines":"79,80"}},{"content":"<strong>Motivazione/Scopo:</strong> Tikhonov &#xe8; convesso e facilissimo da risolvere (Filtro di Wiener, CGLS), ma sfoca i bordi. La TV elimina il rumore forzando un&apos;immagine &quot;costante a tratti&quot; ma preservando i bordi netti (edge-preserving).","children":[],"payload":{"tag":"li","lines":"80,81"}},{"content":"<strong>Collegamento:</strong> Scegliere L1/TV causa la perdita di differenziabilit&#xe0; in zero (cuspide), costringendoci ad abbandonare il gradiente standard per approssimazioni lisce o operatori prossimali (Chambolle-Pock).","children":[],"payload":{"tag":"li","lines":"81,83"}}],"payload":{"tag":"h3","lines":"78,79"}},{"content":"Convessit&#xe0; e Ottimizzazione Numerica (CGLS)","children":[{"content":"<strong>Definizione:</strong> Una funzione convessa garantisce che ogni minimo locale sia anche il minimo globale assoluto. Il CGLS (Conjugate Gradient Least Squares) &#xe8; un solutore iterativo <em>Matrix-Free</em>.","children":[],"payload":{"tag":"li","lines":"84,85"}},{"content":"<strong>Motivazione/Scopo:</strong> Risolve l&apos;enorme problema dell&apos;allocazione RAM. Con matrici che peserebbero Terabyte, il CGLS richiede solo di programmare la <em>forward</em> e <em>back projection</em> come funzioni software (sfruttando le FFT).","children":[],"payload":{"tag":"li","lines":"85,86"}},{"content":"<strong>Collegamento:</strong> Permette il processamento di immagini mediche massicce (es. Tomosintesi) sfruttando architetture parallele (GPU/CUDA).","children":[],"payload":{"tag":"li","lines":"86,88"}}],"payload":{"tag":"h3","lines":"83,84"}},{"content":"Regolarizzazione Iterativa (Early Stopping)","children":[{"content":"<strong>Definizione:</strong> Approccio in cui si usa il puro data fitting ma si ferma l&apos;algoritmo iterativo prematuramente.","children":[],"payload":{"tag":"li","lines":"89,90"}},{"content":"<strong>Motivazione/Scopo:</strong> Sfrutta la dinamica spettrale dei solutori: le prime iterazioni costruiscono le basse frequenze (il segnale utile), le ultime iterazioni ricostruiscono il rumore ad alta frequenza. Fermarsi prima (semiconvergenza) fa da regolarizzatore intrinseco.","children":[],"payload":{"tag":"li","lines":"90,91"}},{"content":"<strong>Collegamento:</strong> Il numero di iterazioni  k  agisce inversamente rispetto al parametro  \\&#x3bb; : meno iterazioni equivalgono a pi&#xf9; regolarizzazione.","children":[],"payload":{"tag":"li","lines":"91,93"}}],"payload":{"tag":"h3","lines":"88,89"}}],"payload":{"tag":"h2","lines":"72,73"}},{"content":"7. Applicazioni Pratiche","children":[{"content":"Image Deblurring","children":[{"content":"<strong>Definizione:</strong> Processo inverso della convoluzione spaziale (PSF), derivante da fuori fuoco o movimento (motion blur).","children":[],"payload":{"tag":"li","lines":"95,96"}},{"content":"<strong>Motivazione/Scopo:</strong> Recuperare un&apos;immagine nitida quando il kernel &#xe8; noto (Non-Blind). Se il kernel &#xe8; ignoto (Blind Deconvolution), il problema diviene iper-mal posto (moltiplicazione di due incognite).","children":[],"payload":{"tag":"li","lines":"96,97"}},{"content":"<strong>Collegamento:</strong> Per il Blind Deblurring, i metodi Model-Based classici faticano a causa della forte non-convessit&#xe0; e dei minimi locali, lasciando oggi il dominio alle architetture Data-Driven e alle Reti Neurali (CNN).","children":[],"payload":{"tag":"li","lines":"97,99"}}],"payload":{"tag":"h3","lines":"94,95"}},{"content":"Super Resolution (SISR)","children":[{"content":"<strong>Definizione:</strong> Aumento computazionale della risoluzione spaziale rispetto ai limiti del sensore hardware.","children":[],"payload":{"tag":"li","lines":"100,101"}},{"content":"<strong>Motivazione/Scopo:</strong> Estremamente critica in ambito Medico, Sorveglianza, Remote Sensing e Microscopia (superando il limite di diffrazione di Abbe tramite tecniche come STORM).","children":[],"payload":{"tag":"li","lines":"101,102"}},{"content":"<strong>Collegamento:</strong> L&apos;approccio ingenuo si affida all&apos;interpolazione spaziale (Nearest Neighbor per velocit&#xe0; ma crea blocchi, Bicubica per smussare i bordi interpolando su griglia 4x4). L&apos;approccio inverso reale prevede il modello combinato di Sottocampionamento + Sfocatura.","children":[],"payload":{"tag":"li","lines":"102,104"}}],"payload":{"tag":"h3","lines":"99,100"}},{"content":"Tomografia Computerizzata (CT) e Metodi Analitici (FBP)","children":[{"content":"<strong>Definizione:</strong> Ricostruzione a fette 3D per evitare la sovrapposizione tessutale delle radiografie 2D. Il modello matematico base &#xe8; l&apos;integrale di linea continuo (Trasformata di Radon), che genera il Sinogramma.","children":[],"payload":{"tag":"li","lines":"105,106"}},{"content":"<strong>Motivazione/Scopo:</strong> Il Teorema della Fetta Centrale dimostra l&apos;equivalenza con lo spazio di Fourier 2D. La ricostruzione analitica standard usa la Filtered Back Projection (FBP) moltiplicando per il Filtro di Ram-Lak.","children":[],"payload":{"tag":"li","lines":"106,107"}},{"content":"<strong>Collegamento:</strong> La FBP funziona bene con dati perfetti e a 360&#xb0;, ma amplifica distruttivamente il rumore, portando al fallimento clinico in condizioni di &quot;Safer Tomography&quot; (Low Dose).","children":[],"payload":{"tag":"li","lines":"107,109"}}],"payload":{"tag":"h3","lines":"104,105"}},{"content":"La Sfida &quot;Safer Tomography&quot; e la Ricostruzione Algebrica Matrix-Free","children":[{"content":"<strong>Definizione:</strong> Principi etici (ALARA) impongono la bassa dose o limitazioni geometriche (Sparse View, Limited Angle). Il problema passa dalla formula continua a una matrice algebrica colossale  Ax = b  discretizzando in Voxel e Ray/Voxel-driven algorithms.","children":[],"payload":{"tag":"li","lines":"110,111"}},{"content":"<strong>Motivazione/Scopo:</strong> I solutori iterativi Model-Based Matrix-Free su GPU riescono a tollerare il forte rumore Poissoniano introdotto dalle riduzioni di dose, offrendo ricostruzioni pulite impossibili per la FBP.","children":[],"payload":{"tag":"li","lines":"111,112"}},{"content":"<strong>Collegamento:</strong> &#xc8; l&apos;applicazione finale che corona l&apos;efficacia dei minimi quadrati regolarizzati (Tikhonov/TV) studiati nell&apos;ottimizzazione numerica.","children":[],"payload":{"tag":"li","lines":"112,114"}}],"payload":{"tag":"h3","lines":"109,110"}}],"payload":{"tag":"h2","lines":"93,94"}},{"content":"8. Valutazione dei Risultati dell&apos;Output","children":[{"content":"Metriche Matematiche (MSE, PSNR, SSIM)","children":[{"content":"<strong>Definizione:</strong> Formule usate per confrontare le immagini calcolate contro un&apos;immagine perfetta e nota di riferimento (Ground Truth) per aggirare la soggettivit&#xe0; dell&apos;occhio umano.","children":[],"payload":{"tag":"li","lines":"116,117"}},{"content":"<strong>Motivazione/Scopo:</strong>","children":[{"content":"<strong>MSE:</strong> Banale differenza quadratica, ma inganna (una traslazione di un pixel produce errore fatale).","children":[],"payload":{"tag":"li","lines":"118,119"}},{"content":"<strong>PSNR:</strong> Rapporto tra segnale e rumore in scala logaritmica (dB), indipendente dalla scala cromatica.","children":[],"payload":{"tag":"li","lines":"119,120"}},{"content":"<strong>SSIM:</strong> Confronta &quot;finestre locali&quot;, mimando l&apos;occhio umano ed essendo sensibile a perdita strutturale e contrasto.","children":[],"payload":{"tag":"li","lines":"120,121"}}],"payload":{"tag":"li","lines":"117,121"}},{"content":"<strong>Collegamento:</strong> Necessarie per quantificare formalmente le differenze di performance tra due algoritmi di ricostruzione diversi.","children":[],"payload":{"tag":"li","lines":"121,122"}}],"payload":{"tag":"h3","lines":"115,116"}}],"payload":{"tag":"h2","lines":"114,115"}}],"payload":{"tag":"h1","lines":"5,6"}},{"colorFreezeLevel":2})</script>
